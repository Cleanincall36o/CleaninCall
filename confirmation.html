<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--blue:#20c997;--blue-deep:#1a9d76;--ink:#0f172a;--ink-soft:#334155;--black:#1a1a1a;--cream:#f5f1ec;--white:#ffffff;}
html,body{min-height:100%;}
body{font-family:'Geist',-apple-system,sans-serif;font-weight:500;background:var(--cream);color:var(--ink);line-height:1.6;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-x:hidden;}
.blob{position:fixed;border-radius:50%;filter:blur(80px);z-index:0;pointer-events:none;}
.b1{width:520px;height:520px;background:#d9e1e4;top:-120px;left:-140px;}
.b2{width:460px;height:460px;background:#c8f0e0;opacity:.6;bottom:-140px;right:-120px;}
.card{position:relative;z-index:1;width:100%;max-width:520px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:44px 32px 36px;text-align:center;box-shadow:0 30px 60px -20px rgba(15,23,42,.25),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.logo{width:150px;height:auto;display:block;margin:0 auto 28px;}
.check{width:76px;height:76px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:22px;box-shadow:0 8px 24px rgba(32,201,151,.4),inset 0 1px 0 rgba(255,255,255,.3);}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,8vw,46px);line-height:1.05;margin-bottom:14px;-webkit-text-stroke:.01em currentColor;}
h1 em{font-style:italic;color:var(--blue-deep);-webkit-text-stroke:0;}
p{color:var(--ink-soft);font-size:16px;margin-bottom:10px;}
.contact{margin:26px 0 8px;padding-top:22px;border-top:1px solid rgba(15,23,42,.08);font-size:15px;}
.contact a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:2px solid var(--blue);}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:22px;padding:16px 30px;border-radius:999px;background:var(--black);color:#fff;font-family:inherit;font-weight:600;font-size:15px;text-decoration:none;box-shadow:0 8px 24px -4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .3s,box-shadow .3s;}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 32px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);}
</style>
